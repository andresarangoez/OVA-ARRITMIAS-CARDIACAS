<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Mecanismos de las arritmias</title>
<link rel="stylesheet" href="../css/00-tipografias.css">
<style>
/* Layout: lista corta de arritmias a la izquierda; a la derecha un solo "escenario": monitor, corazón con la secuencia y tres pestañas (Mecanismo, ECG, Implicación). */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --ink:#0f1d38; --muted:#5d6a80; --line:#e1e6ee; --navy:#16305e;
  --auto:#b87500; --auto-bg:#fff4dd; --trig:#7a3fb8; --trig-bg:#f3ebfc;
  --reen:#1f6fb8; --reen-bg:#e6f0fb; --cond:#b23a3a; --cond-bg:#fbe9e9;
  --ok:#1d7a4a; --bad:#b23a3a; --r1:#2e9e5b; --r2:#d4a017; --r3:#e06c1f; --r4:#c62828;
  --paper:#fff7f7; --gminor:#f7d2d2; --gmajor:#eaa5a5; --trace:#1a1a24;
  --hfill:#f3dcd6;--hline:#a5615a;--hcond:#c9a29c;--lit:#f2a900;--litglow:rgba(242,169,0,.55);--blk:#d3302f;
  --display:"Raleway",system-ui,sans-serif; --body:"Raleway",system-ui,sans-serif; --mono:"Raleway",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1424; --surface:#131e33; --ink:#e7ecf5; --muted:#9aa7bd; --line:#24314a; --navy:#8fb2ec;
  --auto:#ffc457; --auto-bg:#33270c; --trig:#c9a3f2; --trig-bg:#2a1e3d; --reen:#7db6f0; --reen-bg:#142a43; --cond:#ff8f86; --cond-bg:#391a1c;
  --ok:#6fd39c; --bad:#ff8f86; --r1:#5fd08c; --r2:#f2c94c; --r3:#ff9a52; --r4:#ff6b6b;
  --paper:#07120d; --gminor:#0f261a; --gmajor:#1b412c; --trace:#5dff9e;
  --hfill:#3a2326;--hline:#c48a83;--hcond:#6f4b4b;--lit:#ffc23d;--litglow:rgba(255,194,61,.5);--blk:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1424; --surface:#131e33; --ink:#e7ecf5; --muted:#9aa7bd; --line:#24314a; --navy:#8fb2ec;
  --auto:#ffc457; --auto-bg:#33270c; --trig:#c9a3f2; --trig-bg:#2a1e3d; --reen:#7db6f0; --reen-bg:#142a43; --cond:#ff8f86; --cond-bg:#391a1c;
  --ok:#6fd39c; --bad:#ff8f86; --r1:#5fd08c; --r2:#f2c94c; --r3:#ff9a52; --r4:#ff6b6b;
  --paper:#07120d; --gminor:#0f261a; --gmajor:#1b412c; --trace:#5dff9e;
  --hfill:#3a2326;--hline:#c48a83;--hcond:#6f4b4b;--lit:#ffc23d;--litglow:rgba(255,194,61,.5);--blk:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;font-variant-numeric:lining-nums;padding-inline:16px;padding-block:22px 30px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:16px}
.eyebrow{font-family:var(--display);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
h1{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.25;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{font-family:var(--display);font-size:.88rem;background:none;border:0;border-radius:7px;padding:6px 14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--navy);color:var(--bg)}
.auto{--c:var(--auto);--cbg:var(--auto-bg)} .trig{--c:var(--trig);--cbg:var(--trig-bg)}
.reen{--c:var(--reen);--cbg:var(--reen-bg)} .cond{--c:var(--cond);--cbg:var(--cond-bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
/* Explorar */
.ex{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.side{display:grid;gap:10px;position:sticky;top:env(safe-area-inset-top,0px)}
.filters{display:flex;flex-wrap:wrap;gap:5px}
.filters button{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--c);background:var(--cbg);color:var(--ink)}
.list{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.item{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.92rem}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--cbg);font-weight:700}
.item .dim{opacity:.35}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}
.sh h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance}
.sh .org{color:var(--muted);font-size:.85rem}
.navb{display:flex;gap:6px}
.navb button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1rem}
.mon{position:relative;border-radius:10px;overflow:hidden}
.hrb{position:absolute;top:6px;right:8px;font-family:var(--mono);font-weight:700;font-variant-numeric:lining-nums tabular-nums;font-size:.85rem;color:var(--trace);padding:1px 6px}
.strip{display:block;width:100%;height:auto;background:var(--paper)}
.strip .tr{fill:none;stroke:var(--trace);stroke-width:.32;stroke-linejoin:round;stroke-linecap:round}
.strip .gmin{fill:none;stroke:var(--gminor);stroke-width:.07}
.strip .gmaj{fill:none;stroke:var(--gmajor);stroke-width:.16}
.strip .lbl{fill:var(--trace);font-family:var(--mono);font-size:2.4px;font-weight:600;opacity:.7}
.strip .cur{fill:var(--trace)}
.subs{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:.8rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.seq{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:center}
.heart{width:100%;height:auto;display:block}
.heart .hz{fill:var(--hfill);stroke:var(--hline);stroke-width:1.2}
.heart .cd{fill:none;stroke:var(--hcond);stroke-width:2.4;stroke-linecap:round}
.heart .nd,.heart .fx{fill:var(--hcond);stroke:var(--hline);stroke-width:1}
.heart .lbl2{font-family:var(--display);font-size:7.5px;fill:var(--muted)}
.heart .lit.hz{fill:var(--lit)}
.heart .lit.cd{stroke:var(--lit);filter:drop-shadow(0 0 3px var(--litglow))}
.heart .lit.nd,.heart .lit.fx{fill:var(--lit);filter:drop-shadow(0 0 4px var(--litglow))}
.heart .blk.nd{fill:var(--blk)}
.heart .fib.hz{animation:fib .16s steps(2) infinite}
@keyframes fib{0%{fill:var(--hfill)}50%{fill:var(--lit)}}
.heart .loop{fill:none;stroke:var(--lit);stroke-width:2.6;stroke-dasharray:10 7;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--litglow));animation:spin var(--ls,.4s) linear infinite}
@keyframes spin{to{stroke-dashoffset:-17}}
.heart .scar{fill:var(--hline);opacity:.55}
.phase{font-family:var(--display);font-size:1rem;min-height:2.8em;margin:0}
.phase small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.seqctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.seqctl .btn{font-size:.8rem;padding:5px 12px;border-radius:999px}
.seqctl .lbl3{font-size:.78rem;color:var(--muted);margin-left:4px}
.seqctl .seg{display:flex;gap:4px}
.seqctl .seg button{font-size:.78rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;cursor:pointer}
.seqctl .seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.info{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.itabs{display:flex;gap:4px;flex-wrap:wrap}
.itabs button{font-family:var(--display);font-size:.85rem;border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
.itabs button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.ipanel{min-height:96px;font-size:.95rem}
.ipanel p{margin:0 0 6px;max-width:66ch}
.mt{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:500;color:var(--c)}
.ref{color:var(--muted);font-size:.85em}
.ecgf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 14px;margin-bottom:8px}
.ecgf dt{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ecgf dd{margin:0;font-size:.9rem}
.risk{display:grid;gap:6px;margin-bottom:8px}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:340px}
.meter i{height:8px;border-radius:4px;background:var(--line)}
.meter i.on1{background:var(--r1)} .meter i.on2{background:var(--r2)} .meter i.on3{background:var(--r3)} .meter i.on4{background:var(--r4)}
.risk b{font-family:var(--display);font-weight:500}
.tip{font-size:.78rem;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin:0}
@media (max-width:820px){
  .ex{grid-template-columns:1fr}
  .side{position:static}
  .list{display:flex;overflow-x:auto;padding:4px;gap:4px;scrollbar-width:thin}
  .item{white-space:nowrap;flex:none}
}
@media (max-width:560px){.seq{grid-template-columns:1fr}.heart{max-width:190px;margin:0 auto}.ecgf{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Practicar */
.quizw{display:grid;gap:12px;max-width:760px}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.qtop{display:flex;justify-content:space-between;gap:10px;font-family:var(--display);font-size:.8rem;color:var(--muted)}
.qname{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0}
.qhint{color:var(--muted);margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.opt.right{border:2px solid var(--ok)} .opt.wrong{border:2px solid var(--bad);opacity:.8}
.fb{border-radius:10px;padding:12px 14px;background:var(--bg);display:grid;gap:4px;font-size:.95rem}
.fb strong{font-family:var(--display)} .good{color:var(--ok)} .bad{color:var(--bad)}
.btn{font-family:var(--display);border-radius:10px;padding:8px 16px;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:var(--bg)}
.prog{height:5px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--navy);transition:width .3s}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.streak{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.heart .loop,.heart .fib.hz{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Mecanismos de las arritmias</h1>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-exp" aria-selected="true" aria-controls="p-exp">Explorar</button>
      <button role="tab" id="t-quiz" aria-selected="false" aria-controls="p-quiz">Practicar</button>
    </div>
  </div>

  <section id="p-exp" role="tabpanel" aria-labelledby="t-exp">
    <div class="ex">
      <aside class="side">
        <div class="filters" id="filters" aria-label="Filtrar por mecanismo"></div>
        <nav class="list" id="list" aria-label="Arritmias"></nav>
      </aside>
      <article class="stage" id="stage" aria-live="polite"></article>
    </div>
  </section>

  <section id="p-quiz" role="tabpanel" aria-labelledby="t-quiz" hidden>
    <div class="quizw">
      <div class="modes" id="qmode" aria-label="Modo de práctica">
        <button class="pill" aria-pressed="true" data-m="ritmo">¿Qué ritmo es?</button>
        <button class="pill" aria-pressed="false" data-m="mec">¿Qué mecanismo?</button>
        <button class="pill" aria-pressed="false" data-m="riesgo">¿Qué riesgo?</button>
      </div>
      <div class="quiz" id="quiz"></div>
    </div>
  </section>

  <p class="note">Trazos esquemáticos con fines docentes: DII, 25 mm/s, 10 mm/mV. Los números entre paréntesis corresponden a las referencias del módulo.</p>
</div>

<script>
const MECH={
 auto:{n:"Automatismo",d:"Un grupo de células genera impulsos por sí mismo, más rápido de lo normal o fuera de su sitio habitual."},
 trig:{n:"Actividad desencadenada",d:"Posdespolarizaciones tempranas o tardías que, si alcanzan el umbral, disparan nuevos latidos."},
 reen:{n:"Reentrada",d:"Un impulso circula por un circuito y reexcita el tejido una y otra vez."},
 cond:{n:"Alteración de la conducción",d:"El impulso se retrasa o se bloquea en su paso por el sistema de conducción."}
};
const ORIG={sup:"Supraventricular",av:"Unión AV",ven:"Ventricular",var:"Origen variable"};
const RISK=["","Bajo","Moderado","Alto","Crítico"];
const DATA=[
 {id:"st",a:"Taquicardia sinusal",m:"Automatismo normal aumentado",r:"",k:["auto"],o:"sup",rk:1,
  i:"Es una respuesta a otra condición (fiebre, dolor, hipovolemia, anemia). Su importancia depende de esa causa.",
  f:{fc:"100–150 lpm",rit:"Regular",p:"Sinusal, antes de cada QRS",qrs:"Estrecho"},key:"Ritmo sinusal normal, solo que rápido. La frecuencia sube y baja de forma progresiva."},
 {id:"at",a:"Taquicardia auricular focal",m:"Automatismo anormal o actividad desencadenada",r:"2",k:["auto","trig"],o:"sup",rk:2,
  i:"Inicio y fin graduales. Si se mantiene durante semanas puede deteriorar la función ventricular.",
  f:{fc:"120–200 lpm",rit:"Regular",p:"Distinta a la sinusal",qrs:"Estrecho"},key:"Hay una P antes de cada QRS, pero su forma revela un foco auricular distinto del nodo sinusal."},
 {id:"fa",a:"Fibrilación auricular",m:"Desencadenantes en las venas pulmonares y reentrada en un sustrato auricular",r:"7",k:["reen","trig"],o:"sup",rk:3,
  i:"Tiende a progresar. Aumenta el riesgo de ictus embólico y de insuficiencia cardíaca.",
  f:{fc:"Variable",rit:"Irregularmente irregular",p:"Ausente; ondas f",qrs:"Estrecho"},key:"No hay ondas P y los intervalos R–R cambian sin ningún patrón. La línea de base ondula."},
 {id:"fl",a:"Flúter auricular típico",m:"Macrorreentrada alrededor del anillo tricúspide",r:"2",k:["reen"],o:"sup",rk:3,
  i:"Riesgo tromboembólico similar al de la fibrilación auricular, con frecuencia ventricular rápida y fija.",
  f:{fc:"≈150 lpm (2:1)",rit:"Regular",p:"Ondas F en sierra",qrs:"Estrecho"},key:"Ondas F en dientes de sierra, negativas en DII. Una frecuencia fija cercana a 150 lpm sugiere flúter 2:1."},
 {id:"trin",a:"Taquicardia por reentrada intranodal",m:"Reentrada en dos vías nodales",r:"4",k:["reen"],o:"av",rk:1,
  i:"Inicio y fin súbitos. Suele ser bien tolerada y aparecer en corazones estructuralmente sanos.",
  f:{fc:"150–250 lpm",rit:"Regular",p:"Oculta o pseudo-S",qrs:"Estrecho"},key:"Taquicardia regular de QRS estrecho sin P visible. A veces aparece una pseudo-S en derivaciones inferiores."},
 {id:"trav",a:"Taquicardia por reentrada AV",m:"Reentrada por una vía accesoria",r:"4",k:["reen"],o:"av",rk:2,
  i:"Inicio y fin súbitos. Si la vía accesoria conduce una fibrilación auricular, el ritmo puede degenerar en fibrilación ventricular.",
  f:{fc:"150–250 lpm",rit:"Regular",p:"Retrógrada, tras el QRS",qrs:"Estrecho"},key:"La P retrógrada aparece en el segmento ST, separada del QRS (RP corto)."},
 {id:"riva",a:"Ritmo idioventricular acelerado",m:"Automatismo anormal",r:"",k:["auto"],o:"ven",rk:1,
  i:"Frecuente tras la reperfusión del infarto. Generalmente benigno y autolimitado.",
  f:{fc:"50–110 lpm",rit:"Regular",p:"Disociada",qrs:"Ancho"},key:"QRS ancho a una frecuencia parecida a la sinusal. Las P marchan por su cuenta."},
 {id:"tv",a:"TV monomórfica posinfarto",m:"Reentrada en una cicatriz",r:"5",k:["reen"],o:"ven",rk:3,
  i:"Riesgo de muerte súbita. Puede degenerar en fibrilación ventricular.",
  f:{fc:"> 100 lpm",rit:"Regular",p:"Disociada",qrs:"Ancho e idéntico"},key:"Todos los QRS anchos son iguales entre sí. Con infarto previo, una taquicardia de QRS ancho es TV hasta demostrar lo contrario."},
 {id:"tdp",a:"Torsades de pointes",m:"Posdespolarizaciones tempranas",r:"6",k:["trig"],o:"ven",rk:3,
  i:"Se asocia a QT largo (fármacos, hipopotasemia, hipomagnesemia) y puede degenerar en fibrilación ventricular.",
  f:{fc:"200–250 lpm",rit:"Irregular",p:"No visible",qrs:"Ancho, amplitud cambiante"},key:"Los QRS giran alrededor de la línea de base. Antes se ve un QT largo y una extrasístole sobre la T."},
 {id:"dig",a:"Arritmias digitálicas",m:"Posdespolarizaciones tardías",r:"2",k:["trig"],o:"var",rk:2,
  i:"Indican toxicidad por digoxina. La hipopotasemia y la insuficiencia renal la favorecen.",
  f:{fc:"Variable",rit:"Bigeminismo (ejemplo)",p:"Sinusal en latidos normales",qrs:"Estrecho y ancho"},key:"Extrasístoles ventriculares en bigeminismo y ST en cubeta. También pueden verse TA con bloqueo o TV bidireccional."},
 {id:"fv",a:"Fibrilación ventricular",m:"Reentrada funcional múltiple",r:"3",k:["reen"],o:"ven",rk:4,
  i:"Paro cardíaco: no hay gasto cardíaco. Es la principal causa de muerte súbita.",
  f:{fc:"No medible",rit:"Caótico",p:"Ausente",qrs:"No identificable"},key:"Ondulaciones caóticas sin QRS reconocibles. El paciente no tiene pulso."},
 {id:"bav",a:"Bloqueos AV",m:"Alteración de la conducción",r:"1",k:["cond"],o:"av",sub:true,rk:null,i:"",
  f:{fc:"Normal o baja",rit:"Según el grado",p:"No siempre conduce",qrs:"Según el nivel"},key:""}
];
const BAV={
 b1:{n:"1.er grado",hr:"75",rk:1,i:"Generalmente benigno; no produce síntomas por sí mismo.",key:"PR mayor de 0,20 s (más de 5 cuadros pequeños) y constante. Todas las P conducen."},
 w:{n:"Mobitz I",hr:"≈55",rk:1,i:"Suele ser nodal y benigno; puede verse en deportistas o por aumento del tono vagal.",key:"El PR se alarga latido a latido hasta que una P no conduce. Luego el ciclo se repite (Wenckebach)."},
 m2:{n:"Mobitz II",hr:"≈50",rk:3,i:"Suele ser infranodal. Puede progresar a bloqueo completo y causar síncope.",key:"PR constante y, de pronto, una P bloqueada sin alargamiento previo."},
 b3:{n:"3.er grado",hr:"≈44",rk:3,i:"El ritmo de escape es lento e inestable: puede causar síncope, insuficiencia cardíaca o asistolia.",key:"Las P y los QRS no guardan relación: disociación AV completa con ritmo de escape."}
};

/* ---------- Generador de ECG + eventos de activación ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(id,dur,sub){
  const R=rng(id.length*97+(sub||"").length*13+7),C=[],E=[];let X=null,hr="",s0=null;
  const add=(c,a,w)=>C.push([c,a,w]);
  const P=(t,a=.15)=>add(t,a,.022);
  const qrs=q=>{add(q-.025,-.08,.008);add(q,1.1,.011);add(q+.028,-.28,.01)};
  const T=(q,rr,a=.3)=>add(q+Math.min(.3,.17+.17*rr),a,.045);
  const N=(q,rr,pr=.16)=>{P(q-pr);qrs(q);T(q,rr);E.push({t:q-pr,k:"sa"},{t:q,k:"qrs",from:q-pr})};
  const W=q=>{add(q,1.0,.032);add(q+.075,-.7,.032);add(q+.32,-.38,.06);E.push({t:q,k:"wide"})};
  const Psa=(t,a)=>{P(t,a);E.push({t,k:"sa"})};
  const bpm=rr=>Math.round(60/rr);
  switch(id){
   case"st":{let q=.3;while(q<dur+.5){const rr=.5+R()*.02;N(q,rr,.15);q+=rr}hr="120";break}
   case"at":{let q=.3;while(q<dur+.5){P(q-.13,-.14);qrs(q);T(q,.4,.25);E.push({t:q-.13,k:"pA"},{t:q,k:"qrs",from:q-.13});q+=.4}hr="150";break}

     const ph=[R()*6,R()*6,R()*6];X=t=>.05*Math.sin(2*Math.PI*6.3*t+ph[0])+.035*Math.sin(2*Math.PI*8.4*t+ph[1])+.03*Math.sin(2*Math.PI*4.6*t+ph[2]);hr="≈"+bpm(s/n);break}

   case"trin":{let q=.25;while(q<dur+.5){qrs(q);add(q+.045,-.12,.01);T(q,.33,.25);E.push({t:q,k:"qrs",from:q-.14},{t:q+.03,k:"retro"});q+=.33}hr="182";break}
   case"trav":{let q=.25;while(q<dur+.5){qrs(q);add(q+.13,-.13,.02);add(q+.24,.26,.04);E.push({t:q,k:"qrs",from:q-.17},{t:q+.13,k:"retro",ap:1});q+=.36}hr="167";break}
   case"riva":{let q=.4;while(q<dur+.5){W(q);q+=.78}let p=.15;while(p<dur+.5){Psa(p);p+=.86}hr="77";break}

   case"fv":{const ph=[R()*6,R()*6,R()*6,R()*6];X=t=>(.42+.22*Math.sin(2*Math.PI*.45*t))*(.55*Math.sin(2*Math.PI*4.3*t+ph[0])+.35*Math.sin(2*Math.PI*5.6*t+ph[1])+.25*Math.sin(2*Math.PI*3.2*t+ph[2])+.15*Math.sin(2*Math.PI*7.1*t+ph[3]));hr="—";break}

     if(sub==="b3"){let p=.2;while(p<dur+.5){Psa(p);E.push({t:p,k:"blk"});p+=.68}let q=.75;while(q<dur+.5){qrs(q);T(q,1.35);E.push({t:q,k:"esc"});q+=1.35}}

/* ---------- Tira de ECG (estática o monitor en vivo) ---------- */
let gid=0;
function stripSVG(id,{dur=6,H=26,sub,live=false,label=true}={}){
  const B=build(id,dur,sub),W=dur*25,base=H*.58,fs=250,ys=[];let d="";
  for(let i=0;i<=dur*fs;i++){const t=i/fs,y=Math.max(.6,Math.min(H-.6,base-B.v(t)*10));ys.push(y);d+=(i?"L":"M")+(t*25).toFixed(2)+" "+y.toFixed(2)}
  let gmin="",gmaj="";for(let x=0;x<=W;x++)(x%5?(gmin+=`M${x} 0V${H}`):(gmaj+=`M${x} 0V${H}`));for(let y=0;y<=H;y++)(y%5?(gmin+=`M0 ${y}H${W}`):(gmaj+=`M0 ${y}H${W}`));
  const cid="c"+(++gid);
  const svg=`<svg class="strip" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trazo de ECG esquemático" ${live?`data-mon="${cid}"`:""}>
   ${live?`<defs><clipPath id="${cid}"><rect class="r1" x="0" y="0" width="${W}" height="${H}"/><rect class="r2" x="0" y="0" width="0" height="${H}"/></clipPath></defs>`:""}
   <path class="gmin" d="${gmin}"/><path class="gmaj" d="${gmaj}"/>
   ${label?`<text class="lbl" x="1.2" y="3.4">DII</text>`:""}<path class="tr" d="${d}" ${live?`clip-path="url(#${cid})"`:""}/>
   ${live?`<circle class="cur" r=".8" cx="0" cy="${base}"/>`:""}</svg>`;
  return{hr:B.hr,svg,B,ys,W,dur,cid};
}

/* ---------- Motor de animación ---------- */
const MON=new Set();let speed=1,paused=false;

function attachMonitor(root,S,id,{heart=null,phase=null}={}){

  const m={svg,S,id,heart,phase,t:REDUCE?S.dur-.001:0,r1:svg.querySelector(".r1"),r2:svg.querySelector(".r2"),cur:svg.querySelector(".cur"),last:""};
  if(heart){(SHOW[id]||[]).forEach(z=>heart.querySelectorAll(`[data-z="${z}"]`).forEach(e=>e.style.display=""));}

}
function zones(m){
  const t=m.t,L=new Set(),Bk=new Set();let txt="Diástole: el tejido se recupera",pri=0;
  const set=(p,s)=>{if(p>pri){pri=p;txt=s}};
  const id=m.id,s0=m.S.B.s0;
  if(id==="fa"){L.add("fib-atria");set(1,MODE_TXT.fa)}
  if(id==="fl")set(1,MODE_TXT.fl);
  if(id==="fv"){L.add("fib-vent");set(1,MODE_TXT.fv)}
  if(id==="tdp"&&t>=s0){L.add("fib-vent");L.add("fv");set(5,MODE_TXT.tdp)}
  if(id==="trin")set(1,"Circuito que gira dentro del nodo AV por dos vías");
  if(id==="trav")set(1,"Circuito: nodo AV → ventrículo → vía accesoria → aurícula");
  if(id==="tv")set(1,"El impulso gira alrededor de la cicatriz del infarto");
  for(const e of m.S.B.E){
    const d=t-e.t;if(d<-.35||d>.4)continue;
    if(e.k==="sa"&&d>-.06&&d<.06){if(d<-.02)L.add("sa");L.add("atria");set(3,"Nodo sinusal → aurículas (onda P)")}
    if(e.k==="pA"&&d>-.06&&d<.06){L.add("fa");L.add("atria");set(3,"Foco auricular ectópico → aurículas (P de forma distinta)")}
    if(e.k==="qrs"){const f=e.from;if(t>f+.05&&t<e.t-.04){L.add("avn");set(2,"Paso lento por el nodo AV (intervalo PR)")}
      if(d>-.045&&d<0){L.add("his");set(4,"Haz de His y ramas")}
      if(d>=-.02&&d<.09){L.add("vent");set(4,"Despolarización ventricular (QRS estrecho)")}}
    if(e.k==="esc"){if(d>-.05&&d<0){L.add("his");L.add("avn");set(4,"Escape de la unión AV")}if(d>=-.02&&d<.09){L.add("vent");set(4,"Escape de la unión: los ventrículos laten por su cuenta")}}
    if(e.k==="wide"){if(d>-.05&&d<.01){L.add("fv")}if(d>=-.03&&d<.14){L.add("vent");L.add("fv");set(4,"El impulso nace en el ventrículo (QRS ancho)")}}
    if(e.k==="retro"&&d>-.04&&d<.06){L.add("atria");if(e.ap)L.add("ap");set(3,e.ap?"Regresa a las aurículas por la vía accesoria (P retrógrada)":"Las aurículas se activan de forma retrógrada, a la vez que el QRS")}
    if(e.k==="blk"&&d>.05&&d<.25){Bk.add("avn");set(6,m.id==="bav"&&m.S.sub==="b3"?"La P no atraviesa el nodo AV: disociación completa":"Onda P bloqueada: no llega a los ventrículos")}
  }
  return{L,Bk,txt};
}
function paint(m){

  const i=Math.min(S.ys.length-1,Math.round(m.t*250));m.cur.setAttribute("cx",x);m.cur.setAttribute("cy",S.ys[i]);
  if(m.heart){const {L,Bk,txt}=zones(m);
    m.heart.querySelectorAll("[data-z]").forEach(el=>{const z=el.dataset.z;
      el.classList.toggle("lit",L.has(z));el.classList.toggle("blk",Bk.has(z));
      el.classList.toggle("fib",(z==="atria"&&L.has("fib-atria"))||(z==="vent"&&L.has("fib-vent")))});
    if(m.phase&&txt!==m.last){m.phase.innerHTML=`<small>Ahora</small>${txt}`;m.last=txt}}
}

  const ok=isOk(b);if(ok){qz.score++;qz.streak++}else qz.streak=0;
  $("quiz").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(isOk(x))x.classList.add("right")});if(!ok)b.classList.add("wrong");
  const nm=d.a+(d.sub?` · ${BAV[sub].n}`:"");
  const line=qz.mode==="ritmo"?keyOf(d,sub):qz.mode==="mec"?`${d.m}${d.r?` (${d.r})`:""}.`:`Riesgo ${RISK[riskOf(d,sub)].toLowerCase()}. ${implOf(d,sub)}`;
  $("fb").innerHTML=`<div class="fb"><strong class="${ok?"good":"bad"}">${ok?"Correcto.":"No es esa."}</strong><span><b>${nm}.</b> ${line}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="nx">${qz.i+1<qz.order.length?"Siguiente":"Ver resultado"}</button>
    <button class="pill" id="vs">Ver la secuencia</button></div><div id="seqq"></div>`;
  $("vs").onclick=()=>{$("vs").remove();const box=$("seqq");box.innerHTML=`<div class="seq" style="margin-top:12px">${heartSVG()}<div><p class="phase"></p>${ctlHTML()}</div></div>`;
    for(const m of MON)if(m.svg.closest("#quiz")&&!m.heart){m.heart=box.querySelector(".heart");m.phase=box.querySelector(".phase");(SHOW[d.id]||[]).forEach(z=>m.heart.querySelectorAll(`[data-z="${z}"]`).forEach(e=>e.style.display=""))}
    wireCtl(box)};
  $("nx").onclick=()=>{qz.i++;showQ()};$("nx").focus();
}
</script>

<script>
/* Dentro del OVA esta pagina vive en un iframe, que no se ajusta solo a su
   contenido: cada vez que el alto cambia se lo comunica al OVA, y responde
   cuando el OVA se lo pide. */
(function () {
    /* El marco lo dimensiona el OVA al alto del contenido, asi que esta
       pagina no tiene por donde desplazarse: la barra que aparecia era un
       resto de redondeo, y encima cortaba en recto la esquina redondeada del
       marco. Se oculta la barra, no el desbordamiento: la rueda y el teclado
       siguen funcionando si alguna vez el marco se quedara corto. */
    var sinBarra = document.createElement('style');
    sinBarra.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{width:0;height:0}';
    (document.head || document.documentElement).appendChild(sinBarra);

    var ultimo = 0;
    function medir() {
        var alto = Math.ceil(document.documentElement.scrollHeight);
        if (!alto || alto === ultimo) return;
        ultimo = alto;
        parent.postMessage({ ova: 'alto', alto: alto }, '*');
    }
    addEventListener('load', medir);
    addEventListener('resize', medir);
    addEventListener('message', function (e) { if (e.data && e.data.ova === 'medir') medir(); });
    document.addEventListener('click', function () { setTimeout(medir, 60); setTimeout(medir, 420); });
    if (window.ResizeObserver) new ResizeObserver(medir).observe(document.body);
    [120, 400, 1200, 3000].forEach(function (ms) { setTimeout(medir, ms); });
})();
</script>
