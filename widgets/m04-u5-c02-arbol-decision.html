<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Árbol de decisión: estable o inestable</title>
<link rel="stylesheet" href="../css/00-tipografias.css">
<style>
/* Layout: una pregunta a la vez, con el camino recorrido encima en forma de
   migas sobre las que se puede volver. El valor didáctico está en poder
   deshacer una respuesta y ver a dónde llevaba la otra. */
:root{
  --bg:#f5f7f9; --surface:#ffffff; --ink:#1b2733; --muted:#5b6b7a; --line:#c9d3dc;
  --azul:#0b2b4a; --azul-claro:#e8f0f8; --dorado:#c8a54b;
  --verde:#2f8a4c; --verde-suave:#e5f4e9; --rojo:#c8323c; --rojo-suave:#fbe7e8;
  --ambar:#b26a00; --ambar-suave:#fdf1e0;
  --f-display:"Raleway", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Raleway", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);
     font-size:15px;line-height:1.55;font-variant-numeric:lining-nums}
.wrap{max-width:900px;margin:0 auto;padding:26px 16px 42px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(21px,3vw,28px);
   line-height:1.18;margin:0 0 6px;text-wrap:balance;max-width:28ch}
.lead{color:var(--muted);max-width:66ch;margin:0 0 20px}

.migas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px;min-height:32px}
.miga{font:inherit;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--line);color:var(--muted)}
.miga:hover{border-color:var(--azul);color:var(--azul)}
.miga .resp{color:var(--ink);font-weight:700}
.flecha{color:var(--line);font-weight:700}

.nodo{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--azul);
  border-radius:14px;padding:22px 24px}
.nodo .numero{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.nodo h2{font-family:var(--f-display);font-size:21px;font-weight:700;margin:3px 0 8px;text-wrap:balance}
.nodo .porque{color:var(--muted);max-width:62ch;margin:0 0 18px}

.salidas{display:grid;gap:10px}
@media (min-width:640px){.salidas{grid-template-columns:1fr 1fr}}
.salida{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--bg);
  border:1.5px solid var(--line);border-radius:11px;padding:13px 16px}
.salida:hover{border-color:var(--azul);background:var(--azul-claro)}
.salida b{display:block;font-size:16px}
.salida span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}

.final{border-top-color:var(--dorado)}
.final[data-tono="rojo"]{border-top-color:var(--rojo)}
.final[data-tono="verde"]{border-top-color:var(--verde)}
.final[data-tono="ambar"]{border-top-color:var(--ambar)}
.insignia{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;padding:3px 11px;border-radius:99px;margin-bottom:8px}
.insignia[data-tono="rojo"]{background:var(--rojo-suave);color:var(--rojo)}
.insignia[data-tono="verde"]{background:var(--verde-suave);color:var(--verde)}
.insignia[data-tono="ambar"]{background:var(--ambar-suave);color:var(--ambar)}
.final ul{margin:10px 0 0;padding-left:20px}
.final li{margin:5px 0}
.ojo{background:var(--ambar-suave);border-left:4px solid var(--ambar);border-radius:0 9px 9px 0;
  padding:11px 14px;margin-top:16px;font-size:14.5px}

.acciones{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.btn{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:9px;cursor:pointer;
  border:1.5px solid var(--azul);background:var(--azul);color:#fff}
.btn-fantasma{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:9px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:focus-visible,.btn-fantasma:focus-visible,.salida:focus-visible,.miga:focus-visible{
  outline:3px solid var(--azul);outline-offset:2px}
footer{margin-top:22px;font-size:12.5px;color:var(--muted);max-width:80ch}
</style>
<link rel="stylesheet" href="../css/26-tipografia-widgets.css">
</head>
<body>

<div class="wrap">
  <h1>La cadena de preguntas que decide la conducta</h1>
  <p class="lead">Cada respuesta cambia el significado de la siguiente, así que el orden no se puede alterar. Recórrela entera y después vuelve atrás sobre cualquier respuesta para ver a dónde llevaba la otra: ahí es donde se entiende por qué la secuencia es la que es.</p>

  <div class="migas" id="migas"></div>
  <div id="escena"></div>
</div>

<script>
/* ============================================================
   EL ÁRBOL
   Cada nodo es una pregunta con dos o tres salidas. Un nodo final
   lleva `conducta` en vez de `salidas`.
   Fuentes: algoritmos AHA de bradicardia, taquiarritmia con pulso y
   paro cardíaco, y las guías ESC correspondientes.
   ============================================================ */
const ARBOL = {
  pulso: {
    paso:"Pregunta 1 de 4",
    titulo:"¿El paciente tiene pulso?",
    porque:"Es la primera porque separa dos mundos: con pulso se trata la arritmia, sin pulso se reanima y el ritmo solo decide si se da una descarga.",
    salidas:[
      { etiqueta:"Sí, tiene pulso", pista:"Hay circulación espontánea", resumen:"Con pulso", ir:"estable" },
      { etiqueta:"No tiene pulso", pista:"No se palpa en 10 segundos", resumen:"Sin pulso", ir:"paro" }
    ]
  },

  paro: {
    paso:"Pregunta 2 de 2",
    titulo:"¿El ritmo es desfibrilable?",
    porque:"En el paro, la reanimación de alta calidad empieza de inmediato y no depende del ritmo. Lo único que el ritmo decide es si además se administra una descarga.",
    salidas:[
      { etiqueta:"Sí: FV o TV sin pulso", pista:"Desfibrilable", resumen:"FV / TV sin pulso", ir:"f_desfib" },
      { etiqueta:"No: asistolia o AESP", pista:"No desfibrilable", resumen:"Asistolia / AESP", ir:"f_nodesfib" }
    ]
  },

  estable: {
    paso:"Pregunta 2 de 4",
    titulo:"¿Está hemodinámicamente estable?",
    porque:"Esta es la bifurcación de la que cuelga todo lo demás. Inestable significa hipotensión sintomática, alteración del estado mental, signos de shock, dolor torácico isquémico o insuficiencia cardíaca aguda, y que esos signos sean atribuibles a la arritmia.",
    salidas:[
      { etiqueta:"Estable", pista:"Sin signos de hipoperfusión", resumen:"Estable", ir:"frecuencia" },
      { etiqueta:"Inestable", pista:"Con signos atribuibles al ritmo", resumen:"Inestable", ir:"f_inestable" }
    ]
  },

  frecuencia: {
    paso:"Pregunta 3 de 4",
    titulo:"¿Lento o rápido?",
    porque:"En el paciente estable hay tiempo para razonar, y la frecuencia marca qué algoritmo abre la siguiente puerta.",
    salidas:[
      { etiqueta:"Lento", pista:"Bradicardia, habitualmente < 50 lpm", resumen:"Bradicardia", ir:"f_bradi" },
      { etiqueta:"Rápido", pista:"Taquicardia, generalmente ≥ 150 lpm", resumen:"Taquicardia", ir:"ancho" }
    ]
  },

  ancho: {
    paso:"Pregunta 4 de 4",
    titulo:"¿El QRS es ancho o estrecho?",
    porque:"La anchura separa lo supraventricular de lo ventricular, y con ella cambia por completo el tratamiento del paciente estable.",
    salidas:[
      { etiqueta:"Estrecho (< 0,12 s)", pista:"Origen supraventricular", resumen:"QRS estrecho", ir:"reg_estrecho" },
      { etiqueta:"Ancho (≥ 0,12 s)", pista:"Se asume ventricular", resumen:"QRS ancho", ir:"reg_ancho" }
    ]
  },

  reg_estrecho: {
    paso:"Última pregunta",
    titulo:"¿Regular o irregular?",
    porque:"Con el QRS estrecho, la regularidad distingue una reentrada de una fibrilación auricular, y eso cambia la conducta.",
    salidas:[
      { etiqueta:"Regular", pista:"R-R constante", resumen:"Regular", ir:"f_tsv" },
      { etiqueta:"Irregular", pista:"R-R sin patrón", resumen:"Irregular", ir:"f_fa" }
    ]
  },

  reg_ancho: {
    paso:"Última pregunta",
    titulo:"¿Regular o irregular?",
    porque:"Con el QRS ancho, un ritmo irregular obliga a pensar en una fibrilación auricular preexcitada, que es la situación donde más daño hace equivocarse.",
    salidas:[
      { etiqueta:"Regular", pista:"R-R constante", resumen:"Regular", ir:"f_tv" },
      { etiqueta:"Irregular", pista:"R-R variable y morfología cambiante", resumen:"Irregular", ir:"f_preexcitada" }
    ]
  },

  /* ---------- finales ---------- */
  f_desfib: { final:true, tono:"rojo", insignia:"Paro · desfibrilable",
    titulo:"Descarga lo antes posible, sin interrumpir la reanimación",
    puntos:["RCP de alta calidad desde el primer momento","Desfibrilación tan pronto como el equipo esté listo","Adrenalina y antiarrítmico según el algoritmo de paro","Buscar y tratar las causas reversibles"],
    ojo:"Cada minuto sin descarga reduce la supervivencia. La desfibrilación precoz es la intervención que más cambia el desenlace." },

  f_nodesfib: { final:true, tono:"rojo", insignia:"Paro · no desfibrilable",
    titulo:"No se desfibrila: reanimación, adrenalina y causa",
    puntos:["RCP de alta calidad","Adrenalina lo antes posible","Búsqueda sistemática de las causas reversibles (H y T)","Confirmar la asistolia en más de una derivación antes de darla por buena"],
    ojo:"Una fibrilación ventricular fina puede parecer asistolia. Antes de llamarla así: derivación, ganancia y conexiones." },

  f_inestable: { final:true, tono:"rojo", insignia:"Con pulso · inestable",
    titulo:"La terapia eléctrica es el tratamiento, no el rescate",
    puntos:["Cardioversión sincronizada si la arritmia es la causa de la inestabilidad","En la bradicardia inestable: atropina y, si no responde, estimulación","Sedación si el estado del paciente lo permite y no retrasa la descarga","Corregir en paralelo la causa que se identifique"],
    ojo:"Intentar un fármaco «mientras se prepara el desfibrilador» es la demora más frecuente y la más cara. La excepción es la taquicardia ventricular polimórfica, que no se puede sincronizar y recibe descarga no sincronizada." },

  f_bradi: { final:true, tono:"ambar", insignia:"Estable · bradicardia",
    titulo:"Vigilar y buscar la causa",
    puntos:["Monitorización, electrocardiograma de 12 derivaciones y vía venosa","Buscar causa: isquemia, fármacos, hipoxia, alteraciones electrolíticas","Tratar solo si aparece repercusión clínica","En un Mobitz II o un bloqueo completo, pensar pronto en el marcapasos aunque el paciente esté estable"],
    ojo:"En la bradicardia no decide la cifra, decide la repercusión. Una frecuencia de 38 lpm puede ser normal en un deportista." },

  f_tsv: { final:true, tono:"verde", insignia:"Estable · estrecho y regular",
    titulo:"Maniobras vagales y, si no ceden, adenosina",
    puntos:["Maniobras vagales como primer paso","Adenosina en bolo rápido si persiste","Electrocardiograma de 12 derivaciones durante la maniobra: puede revelar un flúter oculto","Buscar el desencadenante: fiebre, anemia, hipovolemia, estimulantes"],
    ojo:"Una taquicardia regular y estrecha cercana a 150 lpm obliga a buscar ondas F: un flúter 2:1 se disfraza de taquicardia supraventricular." },

  f_fa: { final:true, tono:"verde", insignia:"Estable · estrecho e irregular",
    titulo:"Control de la frecuencia y valoración del riesgo tromboembólico",
    puntos:["Control de la frecuencia ventricular","Estimar el riesgo tromboembólico y valorar la anticoagulación","Tener en cuenta el tiempo de evolución antes de plantear cardiovertir","Corregir lo que la sostiene: electrolitos, tiroides, alcohol, infección"],
    ojo:"La irregularidad sin patrón es el dato que más ayuda: los intervalos R-R no se repiten nunca." },

  f_tv: { final:true, tono:"ambar", insignia:"Estable · ancho y regular",
    titulo:"Se asume taquicardia ventricular hasta demostrar lo contrario",
    puntos:["Antiarrítmico intravenoso y consulta con experto","Preparar la cardioversión por si pierde la estabilidad","Electrocardiograma de 12 derivaciones si el tiempo lo permite","Corregir las alteraciones electrolíticas"],
    ojo:"Tratar una supraventricular con aberrancia como si fuera ventricular casi nunca perjudica; lo contrario puede ser letal. Por eso la duda se resuelve del lado grave." },

  f_preexcitada: { final:true, tono:"rojo", insignia:"Estable · ancho e irregular",
    titulo:"Sospecha de fibrilación auricular preexcitada: consulta urgente",
    puntos:["Consulta con experto antes de administrar nada","Antiarrítmico adecuado para la vía accesoria","Cardioversión si se deteriora","Monitorización continua: puede degenerar"],
    ojo:"Es la trampa del árbol. Los fármacos que bloquean el nodo auriculoventricular —adenosina, betabloqueadores, calcioantagonistas, digoxina— pueden acelerar la conducción por la vía accesoria y precipitar una fibrilación ventricular." }
};

/* ============================================================
   ESTADO: el camino recorrido, como lista de {nodo, salida}
   ============================================================ */
let camino = [];
let actual = "pulso";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

function pintarMigas(){
  if (!camino.length) { $("#migas").innerHTML = ""; return; }
  $("#migas").innerHTML = camino.map((p, i) => {
    const s = ARBOL[p.nodo].salidas[p.salida];
    return `<button class="miga" data-volver="${i}" title="Volver a esta pregunta y cambiar la respuesta">
      ${esc(ARBOL[p.nodo].titulo.replace(/^¿|\?$/g, ""))}: <span class="resp">${esc(s.resumen)}</span></button>`;
  }).join('<span class="flecha">›</span>');
}

function pintarNodo(){
  const n = ARBOL[actual];

  if (n.final) {
    $("#escena").innerHTML = `
      <div class="nodo final" data-tono="${n.tono}">
        <span class="insignia" data-tono="${n.tono}">${esc(n.insignia)}</span>
        <h2>${esc(n.titulo)}</h2>
        <ul>${n.puntos.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        <div class="ojo"><strong>Ojo:</strong> ${esc(n.ojo)}</div>
        <div class="acciones">
          <button class="btn" data-reiniciar>Recorrer otra vez</button>
          <button class="btn-fantasma" data-atras>Deshacer la última respuesta</button>
        </div>
      </div>`;
    return;
  }

  $("#escena").innerHTML = `
    <div class="nodo">
      <span class="numero">${esc(n.paso)}</span>
      <h2>${esc(n.titulo)}</h2>
      <p class="porque">${esc(n.porque)}</p>
      <div class="salidas">
        ${n.salidas.map((s, i) => `
          <button class="salida" data-salida="${i}">
            <b>${esc(s.etiqueta)}</b><span>${esc(s.pista)}</span>
          </button>`).join("")}
      </div>
      ${camino.length ? `<div class="acciones"><button class="btn-fantasma" data-atras>Deshacer la última respuesta</button></div>` : ""}
    </div>`;
}

function pintar(){ pintarMigas(); pintarNodo(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;

  if (b.dataset.salida !== undefined) {
    const i = +b.dataset.salida;
    camino.push({ nodo: actual, salida: i });
    actual = ARBOL[actual].salidas[i].ir;
  } else if (b.hasAttribute("data-atras")) {
    const ultimo = camino.pop();
    if (ultimo) actual = ultimo.nodo;
  } else if (b.dataset.volver !== undefined) {
    const i = +b.dataset.volver;
    actual = camino[i].nodo;
    camino = camino.slice(0, i);
  } else if (b.hasAttribute("data-reiniciar")) {
    camino = []; actual = "pulso";
  } else return;

  pintar();
});

pintar();
</script>
<script>
/* Dentro del OVA esta pagina vive en un iframe, que no se ajusta solo a su
   contenido: cada vez que el alto cambia se lo comunica al OVA, y responde
   cuando el OVA se lo pide. */
(function () {
    /* El marco lo dimensiona el OVA al alto del contenido, asi que esta
       pagina no tiene por donde desplazarse: la barra que aparecia era un
       resto de redondeo, y encima cortaba en recto la esquina redondeada del
       marco. Se oculta la barra, no el desbordamiento: la rueda y el teclado
       siguen funcionando si alguna vez el marco se quedara corto. */
    var sinBarra = document.createElement('style');
    sinBarra.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{width:0;height:0}';
    (document.head || document.documentElement).appendChild(sinBarra);

    var ultimo = 0;
    function medir() {
        var alto = Math.ceil(document.documentElement.scrollHeight);
        if (!alto || alto === ultimo) return;
        ultimo = alto;
        parent.postMessage({ ova: 'alto', alto: alto }, '*');
    }
    addEventListener('load', medir);
    addEventListener('resize', medir);
    addEventListener('message', function (e) { if (e.data && e.data.ova === 'medir') medir(); });
    document.addEventListener('click', function () { setTimeout(medir, 60); setTimeout(medir, 420); });
    if (window.ResizeObserver) new ResizeObserver(medir).observe(document.body);
    [120, 400, 1200, 3000].forEach(function (ms) { setTimeout(medir, ms); });
})();
</script>
</body>
</html>
