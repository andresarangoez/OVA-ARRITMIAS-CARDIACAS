<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de los simuladores</title>
<style>
  body{margin:0;padding:24px;background:#0f172a;color:#e6edf3;
       font:15px/1.55 system-ui,"Segoe UI",sans-serif}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:#94a3b8}
  #veredicto{font-size:19px;font-weight:700;padding:14px 18px;border-radius:10px;
             margin:0 0 18px;background:#1e293b;border:1px solid #334155}
  #veredicto.bien{background:#14321f;border-color:#2f8a4c;color:#86efac}
  #veredicto.mal {background:#3a1d22;border-color:#c8323c;color:#fca5a5}
  table{border-collapse:collapse;width:100%;max-width:820px;font-size:14px}
  td{padding:7px 10px;border-bottom:1px solid #263244;vertical-align:top}
  td:first-child{color:#94a3b8;width:40%}
  td.v{font-family:ui-monospace,Consolas,monospace}
  .ok{color:#86efac} .no{color:#fca5a5}
  #marco{position:fixed;left:-3000px;top:0;width:1280px;height:900px;border:0}
</style>
</head>
<body>

<h1>Diagnóstico de los simuladores del OVA</h1>
<p class="sub">Abre el OVA por dentro, llega hasta el simulador de las 6H y 6T y comprueba
   si su monitor está dibujando. Tarda unos quince segundos. No cambia nada.</p>

<div id="veredicto">Comprobando…</div>
<table id="tabla"></table>

<iframe id="marco" src="index.html"></iframe>

<script>
const fila = (k, v, clase) =>
  document.getElementById('tabla').insertAdjacentHTML('beforeend',
    '<tr><td>' + k + '</td><td class="v ' + (clase || '') + '">' + v + '</td></tr>');

const esperar = ms => new Promise(r => setTimeout(r, ms));

function veredicto(texto, bien) {
  const v = document.getElementById('veredicto');
  v.textContent = texto;
  v.className = bien ? 'bien' : 'mal';
}

// Cuenta los fotogramas que el navegador da en medio segundo DENTRO del marco
// del simulador: es lo que mueve el trazado.
function fotogramas(ventana) {
  return new Promise(resolve => {
    let n = 0;
    const t0 = ventana.performance.now();
    (function paso() {
      n++;
      if (ventana.performance.now() - t0 < 500) ventana.requestAnimationFrame(paso);
      else resolve(n);
    })();
    setTimeout(() => resolve(n), 1500);
  });
}

function pixelesPintados(lienzo) {
  try {
    const d = lienzo.getContext('2d').getImageData(0, 0, lienzo.width, lienzo.height).data;
    let n = 0;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 0) n++;
    return n;
  } catch (e) { return -1; }
}

(async function () {
  const marco = document.getElementById('marco');
  await new Promise(r => marco.addEventListener('load', r, { once: true }));
  const ova = marco.contentWindow;
  await esperar(600);

  fila('Navegador', navigator.userAgent.slice(0, 90));
  fila('Menos movimiento (sistema)',
       matchMedia('(prefers-reduced-motion: reduce)').matches ? 'SÍ — activado' : 'no');

  try {
    await ova.abrirModulo('02', 'Valoración');
    await esperar(1200);
    ova.iniciarModulo('02');
    await esperar(600);
  } catch (e) {
    veredicto('No se pudo abrir el módulo 02: ' + e.message, false);
    return;
  }

  const iframe = [...ova.document.querySelectorAll('iframe.widget-ova')]
                   .find(f => f.src.includes('causas-reversibles'));
  if (!iframe) { veredicto('No se encontró el simulador de las 6H y 6T.', false); return; }

  iframe.scrollIntoView({ block: 'center' });
  await esperar(6000);

  const doc = iframe.contentDocument, ven = iframe.contentWindow;
  const lienzo = doc.getElementById('ecg');
  const caja = lienzo.getBoundingClientRect();
  // Las funciones del arreglo viven dentro de una función anónima, así que no
  // se ven desde fuera: se busca el comentario que las encabeza en el propio
  // HTML del simulador.
  const fuente = doc.documentElement.outerHTML;
  const conLienzo = fuente.indexOf('remedirLienzos') >= 0;
  const conBucle = fuente.indexOf('Math.max(0,(ts-last)') >= 0;

  fila('Arreglo del lienzo', conLienzo ? 'presente' : 'FALTA', conLienzo ? 'ok' : 'no');
  fila('Arreglo del bucle', conBucle ? 'presente' : 'FALTA', conBucle ? 'ok' : 'no');
  fila('Hueco del monitor en la página', Math.round(caja.width) + ' × ' + Math.round(caja.height) + ' px');
  fila('Píxeles del lienzo', lienzo.width + ' × ' + lienzo.height,
       lienzo.width > 1 ? 'ok' : 'no');

  const fps = await fotogramas(ven);
  fila('Fotogramas en medio segundo', fps, fps > 0 ? 'ok' : 'no');

  // ¿Sigue vivo el bucle del simulador? Se envuelve su función y se cuenta
  // cuántas veces vuelve a entrar por su cuenta. Si el bucle murió, cero.
  let vueltas = 0;
  if (typeof ven.frame === 'function') {
    const original = ven.frame;
    ven.frame = function () { vueltas++; return original.apply(this, arguments); };
    await esperar(1200);
  }
  fila('Vueltas del bucle en 1,2 s', typeof ven.frame === 'function' ? vueltas : 'no se pudo medir',
       vueltas > 0 ? 'ok' : 'no');

  const px = pixelesPintados(lienzo);
  fila('Píxeles pintados en el trazado', px, px > 0 ? 'ok' : 'no');

  if (lienzo.width <= 1) {
    veredicto('El lienzo del monitor sigue sin medirse. El arreglo no está llegando a este navegador.', false);
  } else if (fps === 0) {
    veredicto('El navegador no da fotogramas: la animación la detiene el sistema, no el OVA.', false);
  } else if (vueltas === 0) {
    veredicto('El lienzo mide bien y hay fotogramas, pero el bucle del simulador está parado.', false);
  } else if (px <= 0) {
    veredicto('El bucle corre y el lienzo mide bien, pero no se pinta nada. El fallo está en el dibujo.', false);
  } else {
    veredicto('El simulador está dibujando correctamente (' + px + ' píxeles de trazado).', true);
  }
})();
</script>
</body>
</html>
